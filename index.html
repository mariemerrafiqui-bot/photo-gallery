
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Interactive Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <script src="gallery.js" defer></script>
</head>
<body>

    <h1>My Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <img class="preview"
         alt="Styling with a Bandana"
         src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon.jpg"
         onmouseover="upDate(this)"
         onmouseleave="unDo()">

    <img class="preview"
         alt="With My Boy"
         src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon2.JPG"
         onmouseover="upDate(this)"
         onmouseleave="unDo()">

    <img class="preview"
         alt="Young Puppy"
         src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon3.jpg"
         onmouseover="upDate(this)"
         onmouseleave="unDo()">

    <img class="preview"
         alt="Beautiful Nature"
         src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8"
         onmouseover="upDate(this)"
         onmouseleave="unDo()">

    <img class="preview"
         alt="Mountain Landscape"
         src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
         onmouseover="upDate(this)"
         onmouseleave="unDo()">

    <img class="preview"
         alt="Beautiful Flowers"
         src="https://images.unsplash.com/photo-1490750967868-88aa4486c946"
         onmouseover="upDate(this)"
         onmouseleave="unDo()">

</body>
</html>
